[package]
name = "anaphora"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/anaphora"
categories = ["science"]
edition = "2024"
rust-version = "1.88"
description = "Retrieval-augmented masked-diffusion language modeling"
license = "MIT"

[features]
default = []
# The Phase 1 calibration harness. Enables a training mode whose retriever
# queries the *clean* sequence instead of the noised view -- the exact bug
# `view` exists to prevent, deliberately reproduced so the evaluation
# protocol can be checked against a run that is known to be leaking.
#
# Gated because a supported switch for the project's central failure is in
# tension with making that failure unrepresentable. Without the feature the
# `QuerySource` variant does not exist, so no code can select it.
leak-harness = []
# The `prepare_corpus` ingest tool. Off by default, and confined to that one
# binary: `parquet` pulls the whole of arrow, and `tokenizers` pulls onig, a C
# library with a build script. Training reads corpus shards and needs neither
# -- the library works on `u32` tokens and document ids, so nothing that links
# it pays for either dependency. The same reasoning keeps `tokenizers` out of
# meganeura's own `[dependencies]`.
wikipedia = ["dep:parquet", "dep:arrow-array", "dep:tokenizers"]

[dependencies]
# Anaphora builds its graphs with Meganeura's IR and trains them through
# Meganeura's session/autodiff stack. Pinned to a git revision for the
# same reason Meganeura pins Blade: the APIs used here (`split_a`/`split_b`
# autodiff, `broadcast_inner`, `cross_attention`) move faster than the
# crates.io release cadence.
meganeura = { git = "https://github.com/kvark/meganeura", branch = "main" }

# Ingest only -- see the `wikipedia` feature.
parquet = { version = "59", optional = true }
arrow-array = { version = "59", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = [
    "onig",
] }

[dev-dependencies]

# Borrowed from blade-graphics and meganeura, so the three crates are read
# and reviewed under one rule set. Declared here rather than as `lib.rs`
# crate attributes so they cover every target in the package -- the tests
# carry as much of the reasoning as the library does, and linting them under
# a different set is how the two drift apart.
[lints.rust]
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"

[lints.clippy]
# We don't use syntax sugar where it's not necessary.
match_like_matches_macro = "allow"
# Redundant matching is more explicit.
redundant_pattern_matching = "allow"
# Explicit lifetimes are often easier to reason about.
needless_lifetimes = "allow"
# No need for defaults in the internal types.
new_without_default = "allow"
# Matches are good and extendable, no need to make an exception here.
single_match = "allow"
# Let me decide when it's too many.
too_many_arguments = "allow"
# Nested conditions often read better than a merged one.
collapsible_if = "allow"
# Indexing several parallel slices by one range is clearer than zipping.
needless_range_loop = "allow"
# We don't match on a reference, unless required.
pattern_type_mismatch = "warn"

[[example]]
name = "phase1"
path = "examples/phase1.rs"

[[example]]
name = "leak_calibration"
path = "examples/leak_calibration.rs"

[[bin]]
name = "prepare_corpus"
path = "src/bin/prepare_corpus.rs"
required-features = ["wikipedia"]
