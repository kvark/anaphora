name: CI
on:
  push:
    branches: ["main", "claude/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check every target
        run: cargo check --all-targets --all-features

      # The rule set itself lives in `[lints]` in Cargo.toml, borrowed from
      # blade-graphics and meganeura. `-D warnings` is what promotes the
      # `warn` entries there to build failures, and `--all-targets` is what
      # extends them past the library to the tests and examples.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
          - name: macOS (Metal)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Meganeura reaches the GPU through blade-graphics: Vulkan on Linux,
      # Metal on macOS. Lavapipe is Mesa's software Vulkan device, which is
      # what makes the GPU tests runnable on a hosted runner with no GPU.
      - name: Install Lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Test
        run: cargo test --release
